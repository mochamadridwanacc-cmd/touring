<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouringMate - Mengarahkan ke Rombongan...</title>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.15rem; margin-bottom: 6px; font-weight: 700; color: #f8fafc; }
    p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
  </style>
  <script>
    (function() {
      // Ambil path lengkap saat ini, contoh: /touring/3431/ atau /touring/3431
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      var isTouringRepo = path.indexOf('/touring') !== -1;
      var basePath = isTouringRepo ? '/touring/' : '/';

      // Buang prefiks /touring/ jika ada
      var subPath = isTouringRepo ? path.replace(/^\/touring\/?/, '') : path.replace(/^\//, '');
      var segments = subPath.split('/').filter(Boolean);

      // Jika segmen pertama adalah room (contoh 3431)
      if (segments.length > 0) {
        var potentialRoom = segments[0];
        // Pastikan bukan file statis .js, .css, .png, dll
        if (potentialRoom.indexOf('.') === -1 && potentialRoom.toLowerCase() !== 'touring') {
          var target = basePath + '?room=' + encodeURIComponent(potentialRoom) + (search ? '&' + search.replace(/^\?/, '') : '') + hash;
          window.location.replace(target);
          return;
        }
      }

      // Fallback ke beranda
      window.location.replace(basePath);
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Menghubungkan ke Rombongan...</h2>
  <p>Mohon tunggu sebentar, Anda sedang dialihkan.</p>
</body>
</html>
